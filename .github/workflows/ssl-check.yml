name: CertiWatch checks

on:
  pull_request:
    # Every change that can affect the checks, the dashboard, the tests or the
    # published bundle is verified offline. Pull requests never publish.
    paths:
      - "requirements.txt"
      - "index.html"
      - "app.js"
      - "style.css"
      - "ssl.conf"
      - "domains.conf"
      - "pages/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ssl-check.yml"
  push:
    branches:
      - main
    # Only changes that alter what the dashboard checks, what it renders or
    # what gets published re-run the checks and redeploy.
    paths:
      - "requirements.txt"
      - "index.html"
      - "app.js"
      - "style.css"
      - "ssl.conf"
      - "domains.conf"
      - "pages/_headers"
      - "scripts/build_dist.py"
      - "src/validate_conf.py"
      - "src/ssl/scripts/**"
      - "src/domain/scripts/**"
      - ".github/workflows/ssl-check.yml"
  schedule:
    # Every day at 06:00 Asia/Colombo (UTC+5:30) = 00:30 UTC.
    - cron: "30 0 * * *"
  workflow_dispatch:  # Manual run from the Actions tab.

# The workflow reads the repository and publishes to Cloudflare Pages.
# It never pushes results back, so the token has no write access.
permissions:
  contents: read

# One publishing attempt per branch at a time. Superseded pull-request runs are
# cancelled; a push or scheduled run on main waits instead of being killed
# mid-publish.
concurrency:
  group: certiwatch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Nothing in this workflow pushes; keep the token out of .git/config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Python tests
        # Offline: certificates are generated in memory, TLS servers are local.
        run: python -m pytest -q -p no:cacheprovider

      - name: Dashboard tests
        run: node --test tests/dashboard.test.mjs

      - name: Publish bundle tests
        run: python3 scripts/test_build_dist.py

  publish:
    name: Check certificates and publish
    # Production only runs after the offline checks pass.
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required inputs
        run: |
          set -euo pipefail
          status=0
          for file in ssl.conf domains.conf index.html pages/_headers scripts/build_dist.py; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required input '$file' is missing or empty."
              status=1
            fi
          done
          exit "$status"

      - name: Reject symlinked inputs
        # The staging step checks this again for every file it copies; this
        # fails earlier and names the repository path.
        run: |
          set -euo pipefail
          status=0
          for file in ssl.conf domains.conf index.html pages pages/_headers scripts/build_dist.py; do
            if [ -L "$file" ]; then
              echo "::error file=$file::Input path '$file' is a symlink; refusing to run."
              status=1
            fi
          done
          exit "$status"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate config files
        # Auto-fixes the checkout copy only; results are never committed.
        run: python3 src/validate_conf.py --no-dns

      - name: Run SSL checker
        run: python3 src/ssl/scripts/check_ssl.py

      - name: Run domain expiry checker
        run: python3 src/domain/scripts/check_domains.py

      - name: Build Pages bundle
        # Allowlisted staging. Fails on missing, empty or malformed inputs, on a
        # symlinked input, and on a TLS run where no certificate was read, so a
        # broken runner cannot replace the published dashboard.
        run: python3 scripts/build_dist.py --out dist

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Project name must match the published hostname (certiwatch.pages.dev).
          # Override with the CLOUDFLARE_PAGES_PROJECT repository variable if the
          # Cloudflare account still holds this project under another name.
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'certiwatch' }} --branch=main
