name: CertiWatch checks

# The single workflow that owns every Cloudflare Pages deployment:
#   * main                              -> production publish
#   * dev, develop, development,
#     development/*, development/*/*   -> preview publish only
# Two levels under development/ is the supported maximum, so the GitHub
# environment policy can list the same patterns: environment rules match one
# path segment per `*` and do not let `**` cross a slash. Pull requests use the
# dedicated, secret-free pr-verify.yml workflow and never publish. Arbitrary
# feature branches, tags and pull requests are not deployed.
on:
  push:
    branches:
      - main
      - dev
      - develop
      - development
      - "development/*"
      - "development/*/*"
    # Only changes that alter what is checked, rendered or published re-run
    # the checks and redeploy.
    paths:
      - "requirements.txt"
      - "certiwatch.toml"
      - "schema/**"
      - "index.html"
      - "app.js"
      - "style.css"
      - "ssl.conf"
      - "domains.conf"
      - "pages/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/ssl-check.yml"
      - ".github/workflows/verify.yml"
  schedule:
    # Every day at 06:00 Asia/Colombo (UTC+5:30) = 00:30 UTC.
    - cron: "30 0 * * *"
  workflow_dispatch:  # Manual run from the Actions tab; publishes from main only.

# The workflow reads the repository and publishes to Cloudflare Pages.
# It never pushes results back, so the token has no write access.
permissions:
  contents: read

# One publishing attempt per branch at a time. A production run on main waits
# instead of being killed mid-publish; preview runs on development branches are
# superseded by the next push.
concurrency:
  group: certiwatch-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Offline checks
    # Reusable and secret-free, so the dedicated PR workflow can run the same
    # contract even while the production workflow is disabled.
    uses: ./.github/workflows/verify.yml

  publish:
    name: Production (main)
    # Production runs only after the offline checks pass and only from main,
    # whether the run was a push, the daily schedule or a manual dispatch.
    needs: verify
    if: github.ref == 'refs/heads/main'
    # Production credentials live only in this environment. Its deployment
    # branch policy must allow main and nothing else, so a job on any other ref
    # cannot read them even if the workflow file changes.
    environment:
      name: certiwatch-production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Verify required inputs
        run: |
          set -euo pipefail
          status=0
          for file in \
            certiwatch.toml \
            schema/certiwatch.schema.json \
            index.html \
            pages/_headers \
            scripts/build_dist.py \
            scripts/build_public_feeds.py \
            scripts/alert_state_store.py \
            src/config.py \
            src/monitor_state.py; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required input '$file' is missing or empty."
              status=1
            fi
          done
          exit "$status"

      - name: Reject symlinked inputs
        # The builders check this again for every file they copy or read; this
        # fails earlier and names the repository path.
        run: |
          set -euo pipefail
          status=0
          for path in \
            certiwatch.toml \
            schema \
            schema/certiwatch.schema.json \
            index.html \
            pages \
            pages/_headers \
            scripts/build_dist.py \
            scripts/build_public_feeds.py \
            scripts/alert_state_store.py \
            src/config.py \
            src/monitor_state.py; do
            if [ -L "$path" ]; then
              echo "::error file=$path::Input path '$path' is a symlink; refusing to run."
              status=1
            fi
          done
          exit "$status"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify production credentials
        # Fail closed on a missing or mismatched account instead of deploying
        # with whatever secret happens to be present. Values are never printed.
        env:
          PAGES_TOKEN: ${{ secrets.CERTIWATCH_PRODUCTION_PAGES_API_TOKEN }}
          PAGES_ACCOUNT: ${{ secrets.CERTIWATCH_PRODUCTION_PAGES_ACCOUNT_ID }}
          TRUSTED_ACCOUNT: ${{ vars.CERTIWATCH_PRODUCTION_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${PAGES_TOKEN:-}" ] || [ -z "${PAGES_ACCOUNT:-}" ]; then
            echo "::error::The certiwatch-production environment needs CERTIWATCH_PRODUCTION_PAGES_API_TOKEN and CERTIWATCH_PRODUCTION_PAGES_ACCOUNT_ID secrets."
            exit 1
          fi
          if [ -z "${TRUSTED_ACCOUNT:-}" ]; then
            echo "::error::Repository variable CERTIWATCH_PRODUCTION_ACCOUNT_ID must name the production Cloudflare account."
            exit 1
          fi
          if [ "$PAGES_ACCOUNT" != "$TRUSTED_ACCOUNT" ]; then
            echo "::error::The production Pages account secret does not match the trusted CERTIWATCH_PRODUCTION_ACCOUNT_ID setting."
            exit 1
          fi

      - name: Resolve Pages project
        # The project name is optional production configuration. Validate it
        # against a strict allowlist here, then interpolate only the validated
        # value into the deploy command, so a repository variable can never
        # smuggle extra shell arguments into the deploy step.
        env:
          PAGES_PROJECT: ${{ vars.CERTIWATCH_PRODUCTION_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          project="${PAGES_PROJECT:-certiwatch}"
          if ! [[ "$project" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || [ "${#project}" -gt 58 ]; then
            echo "::error::CERTIWATCH_PRODUCTION_PAGES_PROJECT must be 1-58 lowercase letters, digits or hyphens, starting and ending with a letter or digit."
            exit 1
          fi
          printf 'CERTIWATCH_PAGES_PROJECT=%s\n' "$project" >> "$GITHUB_ENV"

      - name: Restore public history
        # Public data may use the Actions cache. The key is unique per run so a
        # new cache is written; restore-keys finds the newest previous one.
        # Caches unused for 7 days are evicted, and a repository's cache is
        # capped at 10 GB, so losing history never blocks a publish.
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: history.json
          key: certiwatch-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            certiwatch-history-

      - name: Validate unified configuration
        run: python3 src/validate_conf.py --config certiwatch.toml --no-dns

      - name: Run SSL checker
        # Both checkers read certiwatch.toml; the legacy .conf files are not
        # consulted while the TOML file exists.
        run: python3 src/ssl/scripts/check_ssl.py --config certiwatch.toml

      - name: Run domain expiry checker
        run: python3 src/domain/scripts/check_domains.py --config certiwatch.toml

      - name: Pull private alert state from KV
        # Private state must not use an Actions cache or artifact in a public
        # repository. A dedicated, narrowly scoped KV namespace is optional;
        # without it the CLI never sends and no durable state is claimed.
        if: vars.CERTIWATCH_PRODUCTION_STATE_KV_NAMESPACE != ''
        env:
          CERTIWATCH_STATE_KV_TOKEN: ${{ secrets.CERTIWATCH_PRODUCTION_STATE_KV_TOKEN }}
          CERTIWATCH_STATE_KV_NAMESPACE: ${{ vars.CERTIWATCH_PRODUCTION_STATE_KV_NAMESPACE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CERTIWATCH_PRODUCTION_PAGES_ACCOUNT_ID }}
        run: python3 scripts/alert_state_store.py pull --out .certiwatch/alert_state.json

      - name: Build public history and private alert state
        id: monitor
        env:
          CERTIWATCH_DISCORD_WEBHOOK: ${{ secrets.CERTIWATCH_PRODUCTION_DISCORD_WEBHOOK }}
          CERTIWATCH_ALERTS_ENABLED: ${{ vars.CERTIWATCH_PRODUCTION_ALERTS_ENABLED }}
          CERTIWATCH_STATE_KV_TOKEN: ${{ secrets.CERTIWATCH_PRODUCTION_STATE_KV_TOKEN }}
          CERTIWATCH_STATE_KV_NAMESPACE: ${{ vars.CERTIWATCH_PRODUCTION_STATE_KV_NAMESPACE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CERTIWATCH_PRODUCTION_PAGES_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          transport=none
          checkpoint=none
          if [ -n "${CERTIWATCH_STATE_KV_NAMESPACE:-}" ]; then
            checkpoint=kv
          fi
          if [ "${CERTIWATCH_ALERTS_ENABLED:-false}" = "true" ]; then
            if [ -z "${CERTIWATCH_DISCORD_WEBHOOK:-}" ]; then
              echo "::error::Production alerts are enabled but CERTIWATCH_PRODUCTION_DISCORD_WEBHOOK is not set."
              exit 1
            fi
            if [ "$checkpoint" != "kv" ]; then
              echo "::error::Production Discord alerts require CERTIWATCH_PRODUCTION_STATE_KV_NAMESPACE for a remote checkpoint."
              exit 1
            fi
            transport=discord
          fi
          set +e
          python3 src/monitor_state.py \
            --config certiwatch.toml \
            --ssl-results ssl_results.json \
            --domain-results domain_results.json \
            --history history.json \
            --alert-state .certiwatch/alert_state.json \
            --transport "$transport" \
            --checkpoint "$checkpoint"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Discord delivery failed; pending events remain in the private state and retry on the next run."
            exit 0
          fi
          exit "$code"

      - name: Save public history cache
        # Runs even after a delivery warning, so the snapshot is not lost. A
        # cache outage is a warning, not a publish blocker.
        if: always() && hashFiles('history.json') != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: history.json
          key: certiwatch-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build Pages bundle
        # Feeds and history join the bundle inside this atomic staging step.
        # It fails on missing/empty/malformed inputs, symlinks, an all-
        # unreachable TLS run, a bad history file, or an unmanaged destination.
        run: python3 scripts/build_dist.py --out dist

      - name: Deploy to Cloudflare Pages
        # The branch and project are validated allowlist values exported above,
        # never raw ref or variable text.
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CERTIWATCH_PRODUCTION_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CERTIWATCH_PRODUCTION_PAGES_ACCOUNT_ID }}
          # Production deploys use the main branch of the Pages project.
          command: pages deploy dist --project-name=${{ env.CERTIWATCH_PAGES_PROJECT }} --branch=main

  publish-preview:
    name: Preview (${{ github.ref_name }})
    # Preview only on a push to one of the named development branches. A manual
    # dispatch never deploys a preview, and no other branch is eligible.
    needs: verify
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/development' ||
       startsWith(github.ref, 'refs/heads/development/'))
    # Preview credentials live only in this environment, in a separate
    # Cloudflare account with a distinct project. Its deployment-branch policy
    # must allow exactly dev, develop, development, development/* and
    # development/*/* — the same patterns and depth as the trigger above.
    # Production secrets are never referenced.
    environment:
      name: certiwatch-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify preview credentials and account separation
        # Fail closed when the environment is incomplete, and refuse a preview
        # that resolves to the production account or project. Cloudflare API
        # tokens with Pages edit are account-scoped, so only a different
        # account is a real isolation boundary; these checks catch the common
        # misconfiguration but do not replace that boundary. Values are never
        # printed.
        env:
          PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          PREVIEW_ACCOUNT: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          PRODUCTION_ACCOUNT: ${{ vars.CERTIWATCH_PRODUCTION_ACCOUNT_ID }}
          PRODUCTION_PROJECT: ${{ vars.CERTIWATCH_PRODUCTION_PAGES_PROJECT }}
          PREVIEW_PROJECT: ${{ vars.CERTIWATCH_PREVIEW_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_TOKEN:-}" ] || [ -z "${PREVIEW_ACCOUNT:-}" ]; then
            echo "::error::The certiwatch-preview environment needs CLOUDFLARE_PREVIEW_API_TOKEN and CLOUDFLARE_PREVIEW_ACCOUNT_ID secrets."
            exit 1
          fi
          if [ -z "${PREVIEW_PROJECT:-}" ]; then
            echo "::error::The certiwatch-preview environment needs the CERTIWATCH_PREVIEW_PROJECT variable; previews never default to the production project."
            exit 1
          fi
          production_account="${PRODUCTION_ACCOUNT:-}"
          if [ -z "$production_account" ]; then
            echo "::error::Repository variable CERTIWATCH_PRODUCTION_ACCOUNT_ID must name the production Cloudflare account."
            exit 1
          fi
          if [ "$PREVIEW_ACCOUNT" = "$production_account" ]; then
            echo "::error::Preview and production resolve to the same Cloudflare account; previews require a separate account."
            exit 1
          fi
          production_project="${PRODUCTION_PROJECT:-certiwatch}"
          if [ "$PREVIEW_PROJECT" = "$production_project" ]; then
            echo "::error::Preview and production project names must differ."
            exit 1
          fi

      - name: Resolve preview target
        # Map the ref to a safe, collision-resistant Pages alias and validate
        # the required project variable. The slug alone is ambiguous
        # (development/team-feature and development/team/feature collapse
        # together), so a short hash of the full ref is always appended. Only
        # these allowlisted values are interpolated into the deploy command;
        # raw ref or variable text never is.
        env:
          REF_NAME: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
          PAGES_PROJECT: ${{ vars.CERTIWATCH_PREVIEW_PROJECT }}
        run: |
          set -euo pipefail
          slug=$(printf '%s' "$REF_NAME" \
            | tr '[:upper:]/' '[:lower:]-' \
            | tr -cd 'a-z0-9._-' \
            | cut -c1-48)
          slug="${slug%-}"
          if ! [[ "$slug" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Ref '$REF_NAME' cannot be mapped to a safe Cloudflare Pages branch name."
            exit 1
          fi
          digest=$(printf '%s' "$FULL_REF" | sha256sum | cut -c1-8)
          branch="${slug}-${digest}"
          if ! [[ "$branch" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Ref '$REF_NAME' produced an unsafe Cloudflare Pages branch name."
            exit 1
          fi
          project="${PAGES_PROJECT:-}"
          if [ -z "$project" ]; then
            echo "::error::The certiwatch-preview environment needs the CERTIWATCH_PREVIEW_PROJECT variable; previews never default to the production project."
            exit 1
          fi
          if ! [[ "$project" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || [ "${#project}" -gt 58 ]; then
            echo "::error::CERTIWATCH_PREVIEW_PROJECT must be 1-58 lowercase letters, digits or hyphens, starting and ending with a letter or digit."
            exit 1
          fi
          {
            printf 'CERTIWATCH_PAGES_BRANCH=%s\n' "$branch"
            printf 'CERTIWATCH_PAGES_PROJECT=%s\n' "$project"
          } >> "$GITHUB_ENV"

      - name: Validate unified configuration
        run: python3 src/validate_conf.py --config certiwatch.toml --no-dns

      - name: Run SSL checker
        run: python3 src/ssl/scripts/check_ssl.py --config certiwatch.toml

      - name: Run domain expiry checker
        run: python3 src/domain/scripts/check_domains.py --config certiwatch.toml

      - name: Build Pages bundle
        # No history restore and no monitor_state run: a preview never reads or
        # advances the production history, KV checkpoint or alert transport.
        # history.json is optional for build_dist.py, so the preview bundle
        # simply omits public history.
        run: python3 scripts/build_dist.py --out dist

      - name: Deploy preview to Cloudflare Pages
        # A separate account and project: Pages preview deployments are public
        # by default, so the result data must be treated as public. Production
        # remains in its own account and is untouched.
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CERTIWATCH_PAGES_PROJECT }} --branch=${{ env.CERTIWATCH_PAGES_BRANCH }}
