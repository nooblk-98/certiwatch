name: CertiWatch PR verification

# Dedicated PR-only workflow. It exists separately from the production
# workflow so offline checks can still run when that workflow is disabled for
# repository inactivity. It has no secrets, no deploy step, no history cache
# and no private state.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: certiwatch-pr-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Offline checks
    uses: ./.github/workflows/verify.yml
