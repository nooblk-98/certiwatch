name: CertiWatch preview publish

# Credentialed publisher for previews in the same Cloudflare account as
# production.
#
# It runs from the default branch only, after "CertiWatch preview build"
# finishes on an allowed development branch. The workflow definition, the
# validation code and the deploy command all come from the protected default
# branch; the branch under preview contributes only a static artifact, which is
# checked against a strict allowlist before any token is attached.
#
# Deliberate properties:
#   * No checkout. The job never runs repository code from the source branch,
#     and does not even check out the default branch. Validation is inline.
#   * The run is trusted only when it is a successful push, from this same
#     repository, of the expected workflow file, on an allowed branch.
#   * Credentials live in the certiwatch-preview environment, whose deployment
#     branch policy must allow main only.
#   * The artifact is never handed to an extraction action. Its metadata is
#     fetched for the exact run, its compressed size is bounded, its ZIP central
#     directory is inspected, and only approved members are streamed out with
#     real byte limits - all before the Cloudflare credentials are attached.
#   * The destination is a required, distinct Pages project and an alias that
#     always starts with "preview-", so it can never be the production branch
#     of any project.
on:
  workflow_run:
    workflows: ["CertiWatch preview build"]
    types: [completed]
    # Same set as the build trigger. The job also re-checks the branch, because
    # a filter is configuration while the gate below is code.
    branches:
      - dev
      - develop
      - development
      - "development/*"
      - "development/*/*"

# Reading the artifact from another run needs actions: read. The repository is
# read-only, and the Cloudflare credential arrives through the environment.
permissions:
  actions: read
  contents: read

# One publisher per source branch. A superseded preview never needs to finish,
# and cancelling it cannot interrupt a production deployment.
concurrency:
  group: certiwatch-preview-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  publish:
    name: Preview (${{ github.event.workflow_run.head_branch }})
    # Fail closed on every property that makes a workflow_run safe to trust.
    # A fork run, a pull request run, a failed or cancelled build, a different
    # workflow file, or a disallowed branch simply does not start this job.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.workflow_run.path == '.github/workflows/preview-build.yml' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'dev' ||
       github.event.workflow_run.head_branch == 'develop' ||
       github.event.workflow_run.head_branch == 'development' ||
       startsWith(github.event.workflow_run.head_branch, 'development/'))
    # Credentials live only in this environment. Its deployment branch policy
    # must allow main and nothing else. A workflow_run started by any other
    # branch cannot read these secrets, even if this file is edited.
    environment:
      name: certiwatch-preview
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve preview target
        # Only allowlisted values are written to GITHUB_ENV and later
        # interpolated into the deploy command. Raw branch or variable text
        # never is. The alias always starts with "preview-" and carries a hash
        # of the full ref, so two branches cannot collide and no alias can be
        # "main" or a production alias.
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FULL_REF: ${{ format('refs/heads/{0}', github.event.workflow_run.head_branch) }}
          PAGES_PROJECT: ${{ vars.CERTIWATCH_PREVIEW_PROJECT }}
          PRODUCTION_PROJECT: ${{ vars.CERTIWATCH_PRODUCTION_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          if ! [[ "$HEAD_BRANCH" =~ ^(dev|develop|development|development/[A-Za-z0-9._-]{1,120}|development/[A-Za-z0-9._-]{1,120}/[A-Za-z0-9._-]{1,120})$ ]]; then
            echo "::error::Branch '$HEAD_BRANCH' is outside the supported preview set."
            exit 1
          fi
          slug=$(printf '%s' "$HEAD_BRANCH" \
            | tr '[:upper:]/' '[:lower:]-' \
            | tr -cd 'a-z0-9._-' \
            | cut -c1-40)
          slug="${slug%-}"
          if ! [[ "$slug" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "::error::Branch '$HEAD_BRANCH' cannot be mapped to a safe Pages alias."
            exit 1
          fi
          digest=$(printf '%s' "$FULL_REF" | sha256sum | cut -c1-8)
          branch="preview-${slug}-${digest}"
          if [ "$branch" = "main" ] || [ "$branch" = "production" ]; then
            echo "::error::Preview alias '$branch' would collide with a production alias."
            exit 1
          fi
          project="${PAGES_PROJECT:-}"
          if [ -z "$project" ]; then
            echo "::error::Repository variable CERTIWATCH_PREVIEW_PROJECT is required; previews never default to the production project."
            exit 1
          fi
          if ! [[ "$project" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || [ "${#project}" -gt 58 ]; then
            echo "::error::CERTIWATCH_PREVIEW_PROJECT must be 1-58 lowercase letters, digits or hyphens, starting and ending with a letter or digit."
            exit 1
          fi
          production_project="${PRODUCTION_PROJECT:-certiwatch}"
          if [ "$project" = "$production_project" ]; then
            echo "::error::Preview and production project names must differ; refusing to publish a preview into the production project."
            exit 1
          fi
          {
            printf 'CERTIWATCH_PAGES_BRANCH=%s\n' "$branch"
            printf 'CERTIWATCH_PAGES_PROJECT=%s\n' "$project"
          } >> "$GITHUB_ENV"
          echo "Preview target: project=$project alias=$branch from $HEAD_BRANCH"

      - name: Inspect and extract preview artifact
        # The artifact is untrusted bytes, so no action is allowed to unpack it.
        # This step fetches the single artifact record for the exact run, checks
        # the compressed size, downloads with a hard byte cap, inspects the ZIP
        # central directory (names, types, duplicates, declared sizes, ratio,
        # allowlist), and then streams only the approved members into a fresh
        # directory while counting the bytes actually produced. A lying header
        # is caught during extraction, and no credential is attached yet.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          ARTIFACT_NAME = "certiwatch-preview-bundle"
          MAX_ARCHIVE = 32 * 1024 * 1024
          MAX_FILES = 1500
          MAX_TOTAL = 25 * 1024 * 1024
          MAX_FILE = 8 * 1024 * 1024
          MAX_RATIO = 1000
          FLAT = {
              "index.html",
              "app.js",
              "style.css",
              "ssl_results.json",
              "domain_results.json",
              "_headers",
              "status.json",
              "expiries.ics",
              "badges/manifest.json",
          }
          REQUIRED = {
              "index.html",
              "ssl_results.json",
              "domain_results.json",
              "_headers",
              "status.json",
              "expiries.ics",
              "badges/manifest.json",
          }
          BADGE = re.compile(r"badges/[a-z0-9-]{1,40}-[0-9a-f]{32}\.svg")
          FORBIDDEN_FILES = {
              "history.json": "a preview bundle must not contain public history",
              "_worker.js": "Pages worker scripts are not permitted in a preview",
              "_redirects": "redirects are not permitted in a preview bundle",
          }
          USER_AGENT = "certiwatch-preview-publisher"


          def fail(message: str) -> None:
              raise SystemExit(f"preview artifact rejected: {message}")


          def allowed(rel: str) -> bool:
              return rel in FLAT or BADGE.fullmatch(rel) is not None


          def check_member_name(name: str) -> str:
              """Return a safe, allowlisted relative path or fail closed."""
              if not name or "\x00" in name:
                  fail("empty or NUL-containing member name")
              if name.startswith("/") or "\\" in name:
                  fail(f"absolute or non-POSIX member name {name!r}")
              if re.match(r"^[A-Za-z]:", name):
                  fail(f"drive-qualified member name {name!r}")
              if name.endswith("/"):
                  fail(f"directory member {name!r} is not permitted")
              parts = name.split("/")
              if any(part in ("", ".", "..") for part in parts):
                  fail(f"member name escapes the bundle root: {name!r}")
              if any(len(part) > 255 for part in parts) or len(name) > 1024:
                  fail("member name is too long")
              if name in FORBIDDEN_FILES:
                  fail(FORBIDDEN_FILES[name])
              if not allowed(name):
                  fail(f"file outside the static allowlist: {name!r}")
              return name


          def select_artifact(document: object, expected_name: str) -> dict:
              """Pick the single, unexpired, bounded artifact record for the run."""
              if not isinstance(document, dict):
                  fail("artifact metadata is not an object")
              artifacts = document.get("artifacts")
              total = document.get("total_count")
              if not isinstance(artifacts, list):
                  fail("artifact metadata has no artifacts list")
              if total != 1 or len(artifacts) != 1:
                  fail(
                      f"expected exactly one artifact named {expected_name!r}; "
                      f"the run reported total_count={total!r} and "
                      f"{len(artifacts)} records"
                  )
              artifact = artifacts[0]
              if not isinstance(artifact, dict):
                  fail("artifact record is not an object")
              if artifact.get("name") != expected_name:
                  fail(f"unexpected artifact name {artifact.get('name')!r}")
              if artifact.get("expired") is not False:
                  fail("the artifact is expired or its status is unknown")
              identifier = artifact.get("id")
              if not isinstance(identifier, int) or isinstance(identifier, bool) or identifier <= 0:
                  fail("the artifact id is missing or invalid")
              size = artifact.get("size_in_bytes")
              if not isinstance(size, int) or isinstance(size, bool) or size <= 0:
                  fail("the artifact size is missing or invalid")
              if size > MAX_ARCHIVE:
                  fail(f"compressed artifact is {size} bytes; limit is {MAX_ARCHIVE}")
              return artifact


          def stream_to_path(source, dest: Path, limit: int) -> tuple:
              """Copy a stream to a new file, aborting on real byte count."""
              total = 0
              digest = hashlib.sha256()
              fd = os.open(dest, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
              try:
                  with os.fdopen(fd, "wb") as handle:
                      while True:
                          chunk = source.read(1024 * 1024)
                          if not chunk:
                              break
                          total += len(chunk)
                          if total > limit:
                              fail(f"download exceeded the {limit}-byte compressed limit")
                          digest.update(chunk)
                          handle.write(chunk)
              except BaseException:
                  dest.unlink(missing_ok=True)
                  raise
              return total, digest.hexdigest()


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def _request(url: str, headers: dict):
              opener = urllib.request.build_opener(_NoRedirect)
              return opener.open(urllib.request.Request(url, headers=headers), timeout=120)


          def download_artifact(api: str, repo: str, run_id: str, dest: Path) -> tuple:
              token = os.environ.get("GH_TOKEN", "")
              if not token:
                  fail("GH_TOKEN is not set")
              if not api.startswith("https://"):
                  fail("the GitHub API URL is not https")
              if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
                  fail("the repository name is invalid")
              if not re.fullmatch(r"[0-9]+", run_id):
                  fail("the workflow run id is invalid")
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": USER_AGENT,
              }
              api = api.rstrip("/")
              listing = (
                  f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts"
                  f"?name={urllib.parse.quote(ARTIFACT_NAME)}&per_page=100"
              )
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(listing, headers=headers), timeout=60
                  ) as response:
                      if response.status != 200:
                          fail(f"artifact metadata returned HTTP {response.status}")
                      document = json.load(response)
              except (urllib.error.URLError, OSError, ValueError) as exc:
                  fail(f"cannot read artifact metadata ({exc})")

              artifact = select_artifact(document, ARTIFACT_NAME)
              expected_size = artifact["size_in_bytes"]
              zip_url = (
                  f"{api}/repos/{repo}/actions/artifacts/{artifact['id']}/zip"
              )

              # The API answers with a short-lived redirect to a signed storage
              # URL. Follow exactly one https hop, and never send the token to
              # that host.
              try:
                  source = _request(zip_url, headers)
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      fail(f"artifact download returned HTTP {exc.code}")
                  location = exc.headers.get("Location")
                  exc.close()
                  if not location:
                      fail("artifact redirect has no Location header")
                  parsed = urllib.parse.urlsplit(location)
                  if (
                      parsed.scheme != "https"
                      or not parsed.hostname
                      or parsed.username is not None
                      or parsed.password is not None
                  ):
                      fail("artifact redirect is not a plain https URL")
                  try:
                      source = _request(location, {"User-Agent": USER_AGENT})
                  except urllib.error.HTTPError as exc2:
                      fail(f"artifact storage returned HTTP {exc2.code}")
                  except (urllib.error.URLError, OSError) as exc2:
                      fail(f"artifact storage is unreachable ({exc2})")

              try:
                  status = getattr(source, "status", None)
                  if status != 200:
                      fail(f"artifact download returned HTTP {status}")
                  length = source.headers.get("Content-Length")
                  if length is not None:
                      try:
                          declared = int(length)
                      except ValueError:
                          fail("artifact download has an invalid Content-Length")
                      if declared > MAX_ARCHIVE:
                          fail(
                              f"artifact download announces {declared} bytes; "
                              f"limit is {MAX_ARCHIVE}"
                          )
                  actual, digest = stream_to_path(source, dest, MAX_ARCHIVE)
              finally:
                  source.close()

              if actual != expected_size:
                  fail(
                      f"downloaded {actual} bytes but the run metadata reports "
                      f"{expected_size}; refusing a changed artifact"
                  )
              return actual, digest


          def inspect_and_extract(archive: Path, out: Path) -> dict:
              """Inspect the central directory, then extract approved members."""
              if archive.is_symlink() or not archive.is_file():
                  fail("the downloaded archive is not a regular file")
              try:
                  bundle = zipfile.ZipFile(archive)
              except (zipfile.BadZipFile, OSError) as exc:
                  fail(f"not a readable ZIP archive ({exc})")

              with bundle:
                  infos = bundle.infolist()
                  if not infos:
                      fail("the archive is empty")
                  if len(infos) > MAX_FILES:
                      fail(f"archive has {len(infos)} members; limit is {MAX_FILES}")

                  plan = []
                  seen = set()
                  seen_folded = set()
                  declared_total = 0
                  for info in infos:
                      rel = check_member_name(info.filename)
                      if rel in seen:
                          fail(f"duplicate archive member {rel!r}")
                      seen.add(rel)
                      folded = rel.casefold()
                      if folded in seen_folded:
                          fail(f"case-colliding archive member {rel!r}")
                      seen_folded.add(folded)

                      if info.is_dir() or info.filename.endswith("/"):
                          fail(f"directory member {info.filename!r} is not permitted")
                      mode = (info.external_attr >> 16) & 0o170000
                      if mode == stat.S_IFLNK:
                          fail(f"symlink member {rel!r} is not permitted")
                      if mode not in (0, stat.S_IFREG):
                          fail(f"member {rel!r} is not a regular file")
                      if info.compress_type not in (zipfile.ZIP_STORED, zipfile.ZIP_DEFLATED):
                          fail("ZIP member uses an unsupported compression method")
                      if info.flag_bits & 0x1:
                          fail(f"encrypted member {rel!r} is not permitted")
                      if info.file_size > MAX_FILE:
                          fail(f"member {rel!r} declares {info.file_size} bytes; limit is {MAX_FILE}")
                      if info.file_size < 0 or info.compress_size < 0:
                          fail(f"member {rel!r} has a negative size")
                      if info.file_size == 0:
                          fail(f"empty member {rel!r}")
                      if not info.compress_size:
                          fail(f"member {rel!r} declares data with no compressed bytes")
                      ratio = info.file_size / max(info.compress_size, 1)
                      if ratio > MAX_RATIO:
                          fail(f"member {rel!r} has an unsafe compression ratio")
                      declared_total += info.file_size
                      if declared_total > MAX_TOTAL:
                          fail(f"members declare more than {MAX_TOTAL} bytes")
                      plan.append((info, rel))

                  missing = sorted(REQUIRED - seen)
                  if missing:
                      fail(f"missing required files: {', '.join(missing)}")

                  # Everything checked. Extract to a fresh directory, counting
                  # the bytes the decompressor actually produces.
                  if out.exists():
                      fail("the extraction directory already exists")
                  out.mkdir(parents=True, mode=0o700)

                  written_total = 0
                  digests = {}
                  for info, rel in plan:
                      destination = out / rel
                      destination.parent.mkdir(parents=True, exist_ok=True, mode=0o700)
                      fd = os.open(
                          destination,
                          os.O_CREAT | os.O_EXCL | os.O_WRONLY | os.O_NOFOLLOW,
                          0o600,
                      )
                      hasher = hashlib.sha256()
                      written = 0
                      try:
                          with bundle.open(info) as stream, os.fdopen(fd, "wb") as handle:
                              while True:
                                  chunk = stream.read(256 * 1024)
                                  if not chunk:
                                      break
                                  written += len(chunk)
                                  if written > MAX_FILE:
                                      fail(f"member {rel!r} expanded past {MAX_FILE} bytes")
                                  written_total += len(chunk)
                                  if written_total > MAX_TOTAL:
                                      fail(f"bundle expanded past {MAX_TOTAL} bytes")
                                  hasher.update(chunk)
                                  handle.write(chunk)
                      except BaseException:
                          destination.unlink(missing_ok=True)
                          raise
                      if written != info.file_size:
                          fail(f"member {rel!r} produced {written} bytes, not the declared {info.file_size}")
                      digests[rel] = hasher.hexdigest()

              combined = hashlib.sha256()
              for rel in sorted(digests):
                  combined.update(f"{rel}\0{digests[rel]}\n".encode())
              return {
                  "members": len(plan),
                  "declared": declared_total,
                  "written": written_total,
                  "bundle_sha256": combined.hexdigest(),
              }


          def main() -> None:
              run_id = os.environ.get("RUN_ID", "")
              repo = os.environ.get("REPO", "")
              api = os.environ.get("API_URL", "https://api.github.com")
              runner_temp = os.environ.get("RUNNER_TEMP") or tempfile.gettempdir()
              work = Path(tempfile.mkdtemp(prefix="certiwatch-preview-", dir=runner_temp))
              archive = work / "artifact.zip"
              # A fixed, workspace-relative destination keeps the deploy command
              # static and independent of any environment-supplied path.
              payload = Path("preview-bundle")

              compressed, archive_sha = download_artifact(api, repo, run_id, archive)
              stats = inspect_and_extract(archive, payload)
              print(
                  f"Artifact: {compressed} compressed bytes, sha256:{archive_sha}\n"
                  f"Extracted {stats['members']} files, {stats['written']} bytes, "
                  f"bundle sha256:{stats['bundle_sha256']}"
              )


          if __name__ == "__main__":
              main()
          PY

      - name: Validate preview bundle
        # Defence in depth on the extracted tree: the semantic checks that a
        # static file set can be published. The archive step already enforced
        # the allowlist, types, sizes and aggregate limits.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          from pathlib import Path

          ROOT = Path("preview-bundle")
          MAX_FILES = 1500
          MAX_TOTAL = 25 * 1024 * 1024
          MAX_FILE = 8 * 1024 * 1024
          MAX_BADGES = 1000
          FLAT = {
              "index.html",
              "app.js",
              "style.css",
              "ssl_results.json",
              "domain_results.json",
              "_headers",
              "status.json",
              "expiries.ics",
              "badges/manifest.json",
          }
          REQUIRED = {
              "index.html",
              "ssl_results.json",
              "domain_results.json",
              "_headers",
              "status.json",
              "expiries.ics",
              "badges/manifest.json",
          }
          BADGE = re.compile(r"badges/[a-z0-9-]{1,40}-[0-9a-f]{32}\.svg")
          OBSERVED = frozenset({"valid", "expired", "invalid"})
          FORBIDDEN_FILES = {
              "history.json": "a preview bundle must not contain public history",
              "_worker.js": "Pages worker scripts are not permitted in a preview",
              "_redirects": "redirects are not permitted in a preview bundle",
          }


          def fail(message: str) -> None:
              raise SystemExit(f"preview bundle rejected: {message}")


          if ROOT.is_symlink() or not ROOT.is_dir():
              fail("the bundle directory is missing or a symlink")

          files: dict[str, int] = {}
          digests: dict[str, str] = {}
          total = 0

          for dirpath, dirnames, filenames in os.walk(ROOT, followlinks=False):
              base = Path(dirpath)
              for name in dirnames:
                  path = base / name
                  rel = path.relative_to(ROOT).as_posix()
                  if path.is_symlink():
                      fail(f"symlinked directory {rel!r}")
                  if rel != "badges":
                      fail(f"unexpected directory {rel!r}")
              for name in filenames:
                  path = base / name
                  rel = path.relative_to(ROOT).as_posix()
                  if path.is_symlink():
                      fail(f"symlink {rel!r}")
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode):
                      fail(f"not a regular file: {rel!r}")
                  if "\x00" in rel or rel.startswith("/") or "\\" in rel:
                      fail(f"unsafe path {rel!r}")
                  if rel in FORBIDDEN_FILES:
                      fail(FORBIDDEN_FILES[rel])
                  if rel not in FLAT and not BADGE.fullmatch(rel):
                      fail(f"file outside the static allowlist: {rel!r}")
                  if info.st_size == 0:
                      fail(f"empty file {rel!r}")
                  if info.st_size > MAX_FILE:
                      fail(f"{rel!r} is {info.st_size} bytes; limit is {MAX_FILE}")
                  total += info.st_size
                  if total > MAX_TOTAL:
                      fail(f"bundle exceeds {MAX_TOTAL} bytes")
                  if len(files) >= MAX_FILES:
                      fail(f"bundle exceeds {MAX_FILES} files")
                  files[rel] = info.st_size
                  hasher = hashlib.sha256()
                  with path.open("rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 256), b""):
                          hasher.update(chunk)
                  digests[rel] = hasher.hexdigest()

          missing = sorted(REQUIRED - set(files))
          if missing:
              fail(f"missing required files: {', '.join(missing)}")

          def load_json(name: str) -> dict:
              try:
                  data = json.loads((ROOT / name).read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  fail(f"{name} is not valid JSON ({exc})")
              if not isinstance(data, dict):
                  fail(f"{name} must be a JSON object")
              return data

          for name in ("ssl_results.json", "domain_results.json"):
              data = load_json(name)
              if not isinstance(data.get("generated_at"), str) or not data["generated_at"].strip():
                  fail(f"{name} has no generated_at")
              rows = data.get("results")
              if not isinstance(rows, list) or not rows:
                  fail(f"{name} has no results")
              for row in rows:
                  if not isinstance(row, dict) or not isinstance(row.get("domain"), str):
                      fail(f"{name} contains a malformed row")
              if name == "ssl_results.json":
                  observed = sum(1 for row in rows if row.get("status") in OBSERVED)
                  if not observed:
                      fail("ssl_results.json contains no observed certificate verdict")

          status = load_json("status.json")
          if not isinstance(status.get("domains"), list):
              fail("status.json has no domains list")

          manifest = load_json("badges/manifest.json")
          badges = manifest.get("badges")
          if not isinstance(badges, dict):
              fail("badges/manifest.json has no badges mapping")
          if len(badges) > MAX_BADGES:
              fail(f"badges/manifest.json lists {len(badges)} badges; limit is {MAX_BADGES}")
          listed: set[str] = set()
          for domain, entry in badges.items():
              if not isinstance(domain, str) or not isinstance(entry, dict):
                  fail("badges/manifest.json contains a malformed entry")
              path = entry.get("path")
              if not isinstance(path, str) or not path.startswith("/badges/"):
                  fail(f"badge path for {domain!r} is not under /badges/")
              rel = path.lstrip("/")
              if not BADGE.fullmatch(rel):
                  fail(f"badge path for {domain!r} is outside the badge allowlist")
              if rel not in files:
                  fail(f"badge listed for {domain!r} is missing: {rel!r}")
              if entry.get("sha256") != digests[rel]:
                  fail(f"badge content for {domain!r} does not match the manifest")
              listed.add(rel)
          extras = {
              rel
              for rel in files
              if rel.startswith("badges/") and rel != "badges/manifest.json" and rel not in listed
          }
          if extras:
              fail(f"unlisted badge files: {', '.join(sorted(extras))}")

          head = (ROOT / "index.html").read_bytes()[:512].lower()
          if b"<!doctype html" not in head:
              fail("index.html is not an HTML document")
          if b"BEGIN:VCALENDAR" not in (ROOT / "expiries.ics").read_bytes()[:512]:
              fail("expiries.ics is not a calendar")

          bundle = hashlib.sha256()
          for rel in sorted(digests):
              bundle.update(f"{rel}\0{digests[rel]}\n".encode())
          print(f"Validated {len(files)} files, {total} bytes, bundle sha256:{bundle.hexdigest()}")
          PY

      - name: Verify preview credentials and destination
        # Fail closed when the environment is incomplete. The preview is
        # explicitly required to use the same Cloudflare account as production
        # and a different Pages project: the project boundary is what keeps
        # production history, domains and deployments out of reach. Values are
        # never printed.
        env:
          PAGES_TOKEN: ${{ secrets.CERTIWATCH_PREVIEW_PAGES_API_TOKEN }}
          PAGES_ACCOUNT: ${{ secrets.CERTIWATCH_PREVIEW_PAGES_ACCOUNT_ID }}
          TRUSTED_ACCOUNT: ${{ vars.CERTIWATCH_PRODUCTION_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${PAGES_TOKEN:-}" ] || [ -z "${PAGES_ACCOUNT:-}" ]; then
            echo "::error::The certiwatch-preview environment needs CERTIWATCH_PREVIEW_PAGES_API_TOKEN and CERTIWATCH_PREVIEW_PAGES_ACCOUNT_ID secrets."
            exit 1
          fi
          if [ -z "${TRUSTED_ACCOUNT:-}" ]; then
            echo "::error::Repository variable CERTIWATCH_PRODUCTION_ACCOUNT_ID must name the shared Cloudflare account."
            exit 1
          fi
          if [ "$PAGES_ACCOUNT" != "$TRUSTED_ACCOUNT" ]; then
            echo "::error::Preview and production must use the same Cloudflare account; CERTIWATCH_PREVIEW_PAGES_ACCOUNT_ID does not match CERTIWATCH_PRODUCTION_ACCOUNT_ID."
            exit 1
          fi

      - name: Deploy preview to Cloudflare Pages
        # A distinct project and a preview-* alias. Pages edit tokens are
        # account-scoped, so the project separation, the alias prefix, the
        # environment policy and this workflow's no-checkout design are the
        # compensating controls; see the README security notes.
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd  # v3.15.0
        with:
          apiToken: ${{ secrets.CERTIWATCH_PREVIEW_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CERTIWATCH_PREVIEW_PAGES_ACCOUNT_ID }}
          wranglerVersion: "3.114.17"
          command: pages deploy preview-bundle --project-name=${{ env.CERTIWATCH_PAGES_PROJECT }} --branch=${{ env.CERTIWATCH_PAGES_BRANCH }}

      - name: Record delivery evidence
        if: success()
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          {
            echo "### Preview published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source branch | \`$HEAD_BRANCH\` |"
            echo "| Source commit | \`$HEAD_SHA\` |"
            echo "| Build run | [$SOURCE_RUN](${{ github.server_url }}/${{ github.repository }}/actions/runs/$SOURCE_RUN) |"
            echo "| Pages project | \`$CERTIWATCH_PAGES_PROJECT\` |"
            echo "| Alias | \`$CERTIWATCH_PAGES_BRANCH\` |"
          } >> "$GITHUB_STEP_SUMMARY"
