[package]
name = "certiwatch"
version = "2.2.0"
edition = "2021"
rust-version = "1.88"
description = "CertiWatch: certificate and domain expiry monitoring as one Rust service"
license = "MIT"
publish = false

[[bin]]
name = "certiwatch"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
hickory-proto = { version = "0.26.2", default-features = false, features = ["dnssec-ring"] }
openssl = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2"
x509-parser = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
